name: lateralwordbank

services:
  # docker compose up --build                             -> run once in the container "worldbank-pipeline",
  #                                                          which stays in Docker Desktop with its logs
  # docker compose run --rm --build pipeline              -> the same run in a throwaway container
  # docker compose run --rm pipeline rebuild --load-id X  -> rebuild from raw, no API calls
  pipeline:
    build:
      context: .
      target: runtime
    image: wb-pipeline:local
    container_name: worldbank-pipeline
    # Run as the host user so files written to data/ and output/ belong to them.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./output:/app/output

  # docker compose run --rm test  -> every test, with no network at all
  # docker compose --profile test up test  -> the same, kept as container "worldbank-tests"
  test:
    profiles: [test]  # not started by a plain `docker compose up`
    build:
      context: .
      target: test
    image: wb-pipeline-test:local
    container_name: worldbank-tests
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: none

  # docker compose up -d --build dashboard  -> http://localhost:8501, keeps running ("worldbank-dashboard")
  # Reads the reports in output/; refresh the page after a pipeline run to see new data.
  dashboard:
    profiles: [dashboard]  # not started by a plain `docker compose up`
    build:
      context: .
      target: dashboard
    image: wb-dashboard:local
    container_name: worldbank-dashboard
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:8501:8501"  # this machine only
    volumes:
      - ./output:/app/output:ro
    restart: unless-stopped
